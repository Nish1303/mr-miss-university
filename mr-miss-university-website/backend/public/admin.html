<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Mr. & Miss University Sri Lanka</title>
<style>
  *{ box-sizing: border-box; }
  body{ margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Poppins', sans-serif; background:#0a1128; color:#f6f1e7; }
  .wrap{ max-width: 1180px; margin-inline:auto; padding: 2rem 1.5rem 4rem; }
  h1{ font-size: 1.5rem; font-weight:700; }
  .muted{ color:#9aa1bd; font-size:0.85rem; }
  .card{ background: rgba(255,255,255,0.03); border:1px solid rgba(212,175,55,0.18); border-radius: 14px; padding: 1.5rem; margin-top:1.5rem; }
  input[type="password"], input[type="text"], select{ background:rgba(5,8,16,0.5); border:1px solid rgba(212,175,55,0.25); color:#f6f1e7; padding:0.7em 1em; border-radius:8px; font-size:0.95rem; width:100%; max-width:320px; font-family:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; border-radius: 999px; padding:0.7em 1.5em; font-weight:600; font-size:0.85rem; background:linear-gradient(100deg,#eccb6f,#d4af37 60%,#a8860f); color:#0a0e16; }
  button.secondary{ background:transparent; border:1px solid rgba(246,241,231,0.3); color:#f6f1e7; }
  button.danger{ background:#c08a8a; color:#0a0e16; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  #loginView{ max-width:380px; margin: 3rem auto 0; text-align:center; }
  #loginView h1{ margin-bottom:0.5rem; }
  #loginView .card{ text-align:left; }
  .row{ display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap; }
  table{ width:100%; border-collapse: collapse; margin-top:1rem; font-size:0.85rem; }
  th, td{ text-align:left; padding:0.7em 0.8em; border-bottom:1px solid rgba(212,175,55,0.12); vertical-align:middle; }
  th{ color:#eccb6f; text-transform:uppercase; font-size:0.68rem; letter-spacing:0.08em; }
  tr:hover td{ background: rgba(212,175,55,0.04); }
  img.thumb{ width:42px; height:42px; border-radius:50%; object-fit:cover; border:1px solid rgba(212,175,55,0.4); }
  .tag{ display:inline-block; padding:0.2em 0.7em; border-radius:999px; font-size:0.7rem; background:rgba(212,175,55,0.12); color:#eccb6f; }
  .top-actions{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:0.5rem; }
  .empty{ text-align:center; padding:3rem 1rem; color:#9aa1bd; }
  .error-msg{ color:#ddb3b0; font-size:0.85rem; margin-top:0.6rem; min-height:1.2em; }
  .bio-cell{ max-width:220px; white-space:normal; }
  #detailModal{ position:fixed; inset:0; background:rgba(3,5,11,0.85); display:none; align-items:center; justify-content:center; padding:1.5rem; z-index:50; }
  #detailModal.open{ display:flex; }
  #detailModal .card{ max-width:520px; width:100%; max-height:80vh; overflow:auto; }
</style>
</head>
<body>

<div id="loginView" class="wrap">
  <h1>Admin Login</h1>
  <p class="muted">Mr. &amp; Miss University Sri Lanka — registrations dashboard</p>
  <div class="card">
    <label for="passwordInput" class="muted">Admin password</label>
    <div style="margin-top:0.5rem;">
      <input type="password" id="passwordInput" placeholder="Enter admin password" />
    </div>
    <div style="margin-top:1rem;">
      <button id="loginBtn" style="width:100%;">Log In</button>
    </div>
    <p class="error-msg" id="loginError"></p>
  </div>
</div>

<div id="dashboardView" class="wrap" style="display:none;">
  <div class="top-actions">
    <div>
      <h1>Registrations</h1>
      <p class="muted" id="countLabel">Loading…</p>
    </div>
    <div class="row">
      <input type="text" id="searchInput" placeholder="Search by name or university…" />
      <select id="categoryFilter">
        <option value="all">All categories</option>
        <option value="Mr. University">Mr. University</option>
        <option value="Miss University">Miss University</option>
      </select>
      <button class="secondary" id="exportBtn">Export CSV</button>
      <button class="secondary" id="logoutBtn">Log Out</button>
    </div>
  </div>

  <div class="card" style="overflow-x:auto;">
    <table id="regTable">
      <thead>
        <tr>
          <th>Photo</th><th>Name</th><th>Category</th><th>University</th><th>Year</th><th>Contact</th><th>Submitted</th><th></th>
        </tr>
      </thead>
      <tbody id="regTableBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">No registrations yet.</div>
  </div>
</div>

<div id="detailModal">
  <div class="card" id="detailContent"></div>
</div>

<script>
let adminToken = null; // kept in memory only — never written to localStorage/sessionStorage
let allRegistrations = [];

const loginView = document.getElementById('loginView');
const dashboardView = document.getElementById('dashboardView');
const loginError = document.getElementById('loginError');

function authHeaders(){ return { Authorization: `Bearer ${adminToken}` }; }

document.getElementById('loginBtn').addEventListener('click', attemptLogin);
document.getElementById('passwordInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') attemptLogin(); });

async function attemptLogin(){
  const value = document.getElementById('passwordInput').value.trim();
  if(!value){ loginError.textContent = 'Enter the admin password.'; return; }
  adminToken = value;
  loginError.textContent = '';
  const ok = await loadRegistrations();
  if(ok){
    loginView.style.display = 'none';
    dashboardView.style.display = 'block';
  } else {
    adminToken = null;
    loginError.textContent = 'Incorrect password or server unreachable.';
  }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  adminToken = null;
  allRegistrations = [];
  dashboardView.style.display = 'none';
  loginView.style.display = 'block';
  document.getElementById('passwordInput').value = '';
});

async function loadRegistrations(){
  try{
    const res = await fetch('/api/registrations', { headers: authHeaders() });
    if(!res.ok) return false;
    allRegistrations = await res.json();
    renderTable(allRegistrations);
    return true;
  } catch(err){
    console.error(err);
    return false;
  }
}

function renderTable(list){
  const tbody = document.getElementById('regTableBody');
  const emptyState = document.getElementById('emptyState');
  document.getElementById('countLabel').textContent = `${list.length} registration${list.length === 1 ? '' : 's'}`;
  tbody.innerHTML = '';
  emptyState.style.display = list.length === 0 ? 'block' : 'none';

  list.forEach((r) => {
    const tr = document.createElement('tr');
    const submitted = r.createdAt ? new Date(r.createdAt).toLocaleDateString() : '—';
    tr.innerHTML = `
      <td><img class="thumb" src="${r.photoPath}" alt="${r.fullName}" onerror="this.style.visibility='hidden'"></td>
      <td>${escapeHtml(r.fullName)}</td>
      <td><span class="tag">${escapeHtml(r.category)}</span></td>
      <td>${escapeHtml(r.university)}</td>
      <td>${escapeHtml(r.yearOfStudy)}</td>
      <td>${escapeHtml(r.email)}<br><span class="muted">${escapeHtml(r.phone)}</span></td>
      <td>${submitted}</td>
      <td><button class="secondary" data-id="${r._id}" data-action="view">View</button></td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('[data-action="view"]').forEach((btn) => {
    btn.addEventListener('click', () => openDetail(btn.dataset.id));
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str === undefined || str === null ? '' : String(str);
  return div.innerHTML;
}

function applyFilters(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const category = document.getElementById('categoryFilter').value;
  const filtered = allRegistrations.filter(r => {
    const matchesText = r.fullName.toLowerCase().includes(q) || r.university.toLowerCase().includes(q);
    const matchesCategory = category === 'all' || r.category === category;
    return matchesText && matchesCategory;
  });
  renderTable(filtered);
}
document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('categoryFilter').addEventListener('change', applyFilters);

function openDetail(id){
  const r = allRegistrations.find(x => x._id === id);
  if(!r) return;
  const modal = document.getElementById('detailModal');
  document.getElementById('detailContent').innerHTML = `
    <div style="display:flex; gap:1rem; align-items:center; margin-bottom:1rem;">
      <img class="thumb" style="width:64px;height:64px;" src="${r.photoPath}" alt="${escapeHtml(r.fullName)}">
      <div>
        <h1 style="font-size:1.1rem;">${escapeHtml(r.fullName)}</h1>
        <span class="tag">${escapeHtml(r.category)}</span>
      </div>
    </div>
    <p class="muted">University</p><p>${escapeHtml(r.university)} — ${escapeHtml(r.faculty)} (${escapeHtml(r.yearOfStudy)})</p>
    <p class="muted" style="margin-top:0.8rem;">Contact</p><p>${escapeHtml(r.email)} · ${escapeHtml(r.phone)}</p>
    <p class="muted" style="margin-top:0.8rem;">Date of birth</p><p>${r.dob ? new Date(r.dob).toLocaleDateString() : '—'}</p>
    <p class="muted" style="margin-top:0.8rem;">Bio</p><p>${escapeHtml(r.bio)}</p>
    ${r.previousExperience ? `<p class="muted" style="margin-top:0.8rem;">Previous experience</p><p>${escapeHtml(r.previousExperience)}</p>` : ''}
    <div class="row" style="margin-top:1.5rem;">
      <button class="secondary" id="closeDetailBtn">Close</button>
      <button class="danger" id="deleteBtn" data-id="${r._id}">Delete Registration</button>
    </div>
  `;
  modal.classList.add('open');
  document.getElementById('closeDetailBtn').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('deleteBtn').addEventListener('click', () => deleteRegistration(r._id));
}

document.getElementById('detailModal').addEventListener('click', (e) => {
  if(e.target.id === 'detailModal') e.currentTarget.classList.remove('open');
});

async function deleteRegistration(id){
  if(!confirm('Delete this registration? This cannot be undone.')) return;
  try{
    const res = await fetch(`/api/registrations/${id}`, { method: 'DELETE', headers: authHeaders() });
    if(!res.ok){ alert('Could not delete this registration.'); return; }
    document.getElementById('detailModal').classList.remove('open');
    await loadRegistrations();
  } catch(err){
    alert('Network error while deleting.');
  }
}

document.getElementById('exportBtn').addEventListener('click', async () => {
  try{
    const res = await fetch('/api/registrations/export/csv', { headers: authHeaders() });
    if(!res.ok){ alert('Export failed.'); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'registrations.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch(err){
    alert('Network error during export.');
  }
});
</script>
</body>
</html>
